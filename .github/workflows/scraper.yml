name: POLB Daily Scraper

on:
  schedule:
    # 台灣時間每天中午 12:00 (對應 UTC 時間 04:00)
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: 載入專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝套件
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi beautifulsoup4

      - name: 執行長堤港爬蟲
        run: python main.py
